name: rust-ci

on:
  push:
    paths:
      - "rust/**"
      - ".github/workflows/rust-ci.yml"
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/rust-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Format
        working-directory: rust
        run: cargo fmt --check
      - name: Lint
        working-directory: rust
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        working-directory: rust
        run: cargo test --all-targets
      - name: Package
        working-directory: rust
        run: cargo package --locked

  integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Checkout cccc (daemon)
        uses: actions/checkout@v4
        with:
          repository: ChesterRa/cccc
          ref: main
          path: cccc

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cccc daemon
        run: |
          python -m pip install -U pip
          python -m pip install -e cccc

      - name: Rust SDK against current daemon
        run: |
          set -euo pipefail
          export CCCC_HOME="$PWD/.tmp_cccc_home"
          mkdir -p "$CCCC_HOME"

          python -m cccc.daemon_main run >"$CCCC_HOME/daemon.log" 2>&1 &
          DAEMON_PID=$!
          cleanup() {
            kill "$DAEMON_PID" >/dev/null 2>&1 || true
            wait "$DAEMON_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for i in $(seq 1 120); do
            if [ -f "$CCCC_HOME/daemon/ccccd.addr.json" ]; then
              break
            fi
            sleep 0.1
          done
          test -f "$CCCC_HOME/daemon/ccccd.addr.json"
          cargo run --manifest-path rust/Cargo.toml --example compat_check
