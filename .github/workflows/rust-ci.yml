name: rust-ci

on:
  push:
    paths:
      - "scripts/check_release_versions.py"
      - "spec/core.json"
      - "rust/**"
      - ".github/workflows/rust-ci.yml"
  pull_request:
    paths:
      - "scripts/check_release_versions.py"
      - "spec/core.json"
      - "rust/**"
      - ".github/workflows/rust-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check coordinated SDK versions
        run: python3 scripts/check_release_versions.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Format
        working-directory: rust
        run: cargo fmt --check
      - name: Lint
        working-directory: rust
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        working-directory: rust
        run: cargo test --all-targets
      - name: Package
        working-directory: rust
        run: cargo package --locked

  integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Read supported core revision
        id: core
        run: python3 -c 'import json, os; d=json.load(open("spec/core.json")); open(os.environ["GITHUB_OUTPUT"], "a").write("revision="+d["revision"]+"\n")'

      - name: Checkout cccc (daemon)
        uses: actions/checkout@v4
        with:
          repository: ChesterRa/cccc
          ref: ${{ steps.core.outputs.revision }}
          path: cccc

      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"

      - uses: dtolnay/rust-toolchain@1.88.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            cccc -> target
            rust -> target

      - name: Build native CCCC
        working-directory: cccc
        run: cargo build --locked -p cccc --bin cccc

      - name: Rust SDK against current daemon
        run: |
          set -euo pipefail
          export CCCC_HOME="$PWD/.tmp_cccc_home"
          export PATH="$PWD/cccc/target/debug:$PATH"
          mkdir -p "$CCCC_HOME"

          cleanup() {
            cccc daemon stop >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          cccc daemon start
          test -f "$CCCC_HOME/daemon/ccccd.addr.json"
          cargo package --manifest-path rust/Cargo.toml --locked
          sdk_version=$(python3 -c 'import json; print(json.load(open("spec/core.json"))["version"])')
          cargo run --manifest-path "rust/target/package/cccc-sdk-$sdk_version/Cargo.toml" --example compat_check
