name: rust-ci

on:
  push:
    paths:
      - "rust/**"
      - "spec/SDK_DAEMON_TARGET_0_4_33.json"
      - ".github/workflows/rust-ci.yml"
  pull_request:
    paths:
      - "rust/**"
      - "spec/SDK_DAEMON_TARGET_0_4_33.json"
      - ".github/workflows/rust-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check SDK hardening contract
        run: python3 scripts/check_sdk_hardening.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Format
        working-directory: rust
        run: cargo fmt --check
      - name: Lint
        working-directory: rust
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        working-directory: rust
        run: cargo test --locked --all-targets
      - name: Package
        working-directory: rust
        run: cargo package --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.74.0"
      - name: Check declared MSRV
        working-directory: rust
        run: cargo check --locked

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test cross-platform cursor replacement
        working-directory: rust
        run: cargo test --locked --all-targets

  native-daemon-0433:
    runs-on: ubuntu-latest
    env:
      CCCC_RUN_LIVE_RELIABILITY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Install exact native daemon
        run: cargo install cccc --version '=0.4.33' --locked
      - name: Run live reliability contract
        run: |
          set -euo pipefail
          export CCCC_HOME="$RUNNER_TEMP/cccc-sdk-rust-0433"
          cccc daemon start
          cleanup() {
            cccc daemon stop >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          cargo test --locked --manifest-path rust/Cargo.toml --test live_reliability -- --nocapture

  integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Checkout cccc (daemon)
        uses: actions/checkout@v4
        with:
          repository: ChesterRa/cccc
          ref: main
          path: cccc

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cccc daemon
        run: |
          python -m pip install -U pip
          python -m pip install -e cccc

      - name: Rust SDK against current daemon
        run: |
          set -euo pipefail
          export CCCC_HOME="$PWD/.tmp_cccc_home"
          mkdir -p "$CCCC_HOME"

          python -m cccc.daemon_main run >"$CCCC_HOME/daemon.log" 2>&1 &
          DAEMON_PID=$!
          cleanup() {
            kill "$DAEMON_PID" >/dev/null 2>&1 || true
            wait "$DAEMON_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for i in $(seq 1 120); do
            if [ -f "$CCCC_HOME/daemon/ccccd.addr.json" ]; then
              break
            fi
            sleep 0.1
          done
          test -f "$CCCC_HOME/daemon/ccccd.addr.json"
          cargo run --manifest-path rust/Cargo.toml --example compat_check
