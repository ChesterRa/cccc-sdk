name: python-integration

on:
  push:
    paths:
      - "spec/core.json"
      - "python/**"
      - ".github/workflows/python-integration.yml"
  pull_request:
    paths:
      - "spec/core.json"
      - "python/**"
      - ".github/workflows/python-integration.yml"
  workflow_dispatch:
    inputs:
      cccc_ref:
        description: "CCCC repo ref (branch/tag/sha) to test against"
        required: false
        default: ""

jobs:
  integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout cccc-sdk
        uses: actions/checkout@v4

      - name: Read supported core revision
        id: core
        run: python3 -c 'import json, os; d=json.load(open("spec/core.json")); open(os.environ["GITHUB_OUTPUT"], "a").write("revision="+d["revision"]+"\n")'

      - name: Checkout cccc (daemon)
        uses: actions/checkout@v4
        with:
          repository: ChesterRa/cccc
          ref: ${{ inputs.cccc_ref || steps.core.outputs.revision }}
          path: cccc

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"

      - uses: dtolnay/rust-toolchain@1.88.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cccc -> target

      - name: Build native CCCC
        working-directory: cccc
        run: cargo build --locked -p cccc --bin cccc

      - name: Build and install candidate wheel
        run: |
          python -m pip install -U pip build
          python -m build python
          python -m pip install python/dist/*.whl

      - name: Smoke (daemon + sdk)
        run: |
          set -euo pipefail
          export CCCC_HOME="$PWD/.tmp_cccc_home"
          export PATH="$PWD/cccc/target/debug:$PATH"
          cleanup() {
            cccc daemon stop >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          cccc daemon start
          python python/examples/compat_check.py
          python python/examples/release_smoke.py
