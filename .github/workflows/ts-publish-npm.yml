name: ts-publish-npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm Trusted Publishing (OIDC) and provenance attestations.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Check coordinated SDK versions
        run: python3 scripts/check_release_versions.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing needs npm >= 11.5.1; Node 20 ships npm 10.
      - name: Upgrade npm for Trusted Publishing
        run: |
          npm install -g npm@11
          npm --version

      - name: Validate version
        working-directory: ts
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"

          if [ "$PACKAGE_VERSION" != "$TAG" ]; then
            echo "error: ts/package.json version ($PACKAGE_VERSION) != tag ($TAG)" >&2
            exit 2
          fi

      - name: Install dependencies
        working-directory: ts
        run: npm ci

      - name: Unit tests
        working-directory: ts
        run: npm test

      - name: Type check
        working-directory: ts
        run: npm run typecheck

      - name: Build
        working-directory: ts
        run: npm run build

      - name: Determine npm tag
        id: npm-tag
        run: |
          if [[ "$GITHUB_REF_NAME" == *rc* ]] || [[ "$GITHUB_REF_NAME" == *beta* ]] || [[ "$GITHUB_REF_NAME" == *alpha* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # Auth is the npmjs.com Trusted Publisher (OIDC) for this workflow; no secret.
      - name: Publish to npm
        working-directory: ts
        run: npm publish --tag ${{ steps.npm-tag.outputs.tag }} --access public
