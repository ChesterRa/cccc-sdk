name: rust-publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    if: ${{ !contains(github.ref_name, 'rc') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for crates.io Trusted Publishing (OIDC).
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Check coordinated SDK versions
        run: python3 scripts/check_release_versions.py

      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        working-directory: rust
        run: cargo test --locked --all-targets

      # Auth is the crates.io Trusted Publisher for this workflow; no secret.
      # The action exchanges the GitHub OIDC token for a short-lived crates.io
      # token and revokes it when the job ends.
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        working-directory: rust
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
