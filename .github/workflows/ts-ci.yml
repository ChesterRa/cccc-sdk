name: ts-ci

on:
  push:
    paths:
      - "scripts/check_release_versions.py"
      - "spec/core.json"
      - "ts/**"
      - ".github/workflows/ts-ci.yml"
  pull_request:
    paths:
      - "scripts/check_release_versions.py"
      - "spec/core.json"
      - "ts/**"
      - ".github/workflows/ts-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check coordinated SDK versions
        run: python3 scripts/check_release_versions.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - name: Install
        working-directory: ts
        run: npm ci

      - name: Unit tests
        working-directory: ts
        run: npm test

      - name: Typecheck
        working-directory: ts
        run: npm run typecheck

      - name: Build
        working-directory: ts
        run: npm run build

  integration:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Read supported core revision
        id: core
        run: python3 -c 'import json, os; d=json.load(open("spec/core.json")); open(os.environ["GITHUB_OUTPUT"], "a").write("revision="+d["revision"]+"\n")'

      - name: Checkout cccc (daemon)
        uses: actions/checkout@v4
        with:
          repository: ChesterRa/cccc
          ref: ${{ steps.core.outputs.revision }}
          path: cccc

      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - uses: dtolnay/rust-toolchain@1.88.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cccc -> target

      - name: Install TS SDK deps
        working-directory: ts
        run: |
          npm ci
          npm run build
          npm pack --pack-destination /tmp
          npm install --prefix /tmp/cccc-sdk-consumer /tmp/cccc-sdk-*.tgz
          cp release-smoke.mjs /tmp/cccc-sdk-consumer/release-smoke.mjs

      - name: Build native CCCC
        working-directory: cccc
        run: cargo build --locked -p cccc --bin cccc

      - name: SDK <-> daemon integration smoke
        run: |
          set -euo pipefail
          export CCCC_HOME="$PWD/.tmp_cccc_home"
          export PATH="$PWD/cccc/target/debug:$PATH"
          mkdir -p "$CCCC_HOME"

          cleanup() {
            cccc daemon stop >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          cccc daemon start
          test -f "$CCCC_HOME/daemon/ccccd.addr.json"

          node /tmp/cccc-sdk-consumer/release-smoke.mjs
          (cd ts && node --import tsx examples/send.ts)
